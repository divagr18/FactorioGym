<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">FactorioGym</title>
  <desc id="desc">Reinforcement learning for factory construction. An animated overhead drill feeds ore through a furnace into storage.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#151515"/></pattern>
    <pattern id="treads" width="16" height="18" patternUnits="userSpaceOnUse"><path d="M2 3L7 9L2 15" fill="none" stroke="#333"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="16 0" dur="0.53s" repeatCount="indefinite"/></pattern>
    <g id="ore"><path d="M0 -4L4 0L0 4L-4 0Z" fill="#ddd"/></g>
    <g id="plate"><rect x="-5" y="-3" width="10" height="6" rx="2" fill="#e3ad67"/></g>
  </defs>
  <rect width="1600" height="500" fill="#000"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="238" fill="#eee" font-size="107" font-weight="500" letter-spacing="-4">Factorio<tspan fill="#e3ad67">Gym</tspan></text>
    <text x="48" y="305" fill="#aaa" font-size="30">Reinforcement learning for factory</text>
    <text x="48" y="350" fill="#aaa" font-size="30">construction.</text>
  </g>
  <!-- The overhead drawing and its labels are centered together at y=250. -->
  <g transform="translate(780 236) scale(1.3)" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(0 -9)">
      <rect x="85" width="169" height="18" rx="3" fill="#080808" stroke="#777"/>
      <rect x="306" width="170" height="18" rx="3" fill="#080808" stroke="#777"/>
      <rect x="86" y="1" width="167" height="16" fill="url(#treads)"/>
      <rect x="307" y="1" width="168" height="16" fill="url(#treads)"/>
    </g>
    <g><use href="#ore"/><animateMotion path="M89 0H250" dur="3.08s" repeatCount="indefinite"/></g>
    <g><use href="#ore"/><animateMotion path="M89 0H250" dur="3.08s" begin="-1.54s" repeatCount="indefinite"/></g>
    <g><use href="#plate"/><animateMotion path="M310 0H472" dur="3.08s" repeatCount="indefinite"/></g>
    <g><use href="#plate"/><animateMotion path="M310 0H472" dur="3.08s" begin="-1.54s" repeatCount="indefinite"/></g>
    <!-- Drill gantry and ore patch, viewed from above. -->
    <g transform="translate(60 0)">
      <g fill="#111" stroke="#555"><path d="M-31 -33h8v8h-8zM-16 -35h8v8h-8zM0 -33h8v8H0zM16 -34h8v8h-8zM-32 -13h8v8h-8zM-30 7h8v8h-8zM-30 25h8v8h-8zM-14 27h8v8h-8zM2 26h8v8H2zM18 25h8v8h-8z"/></g>
      <g fill="#080808" stroke="#aaa" stroke-width="1.5"><rect x="-29" y="-30" width="58" height="6" rx="2"/><rect x="-29" y="24" width="58" height="6" rx="2"/></g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="-5 0;5 0;-5 0" dur="3.87s" repeatCount="indefinite"/>
        <rect x="-17" y="-24" width="34" height="48" rx="4" fill="#080808" stroke="#aaa" stroke-width="1.5"/>
        <circle r="14" fill="none" stroke="#555" stroke-width="1.5"/>
        <circle r="10" fill="none" stroke="#e3ad67" stroke-width="1.5"/>
        <g stroke="#e3ad67" stroke-width="2"><path d="M4 0H10M-4 0H-10M0 4V10M0 -4V-10"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.14s" repeatCount="indefinite"/></g>
        <circle r="3" fill="#080808" stroke="#ddd"/>
      </g>
      <g fill="#080808" stroke="#aaa"><circle cx="-24" cy="-27" r="1.5"/><circle cx="24" cy="-27" r="1.5"/><circle cx="-24" cy="27" r="1.5"/><circle cx="24" cy="27" r="1.5"/><rect x="18" y="-7" width="12" height="14" rx="3"/></g>
    </g>
    <!-- Furnace masonry, open core and grate. -->
    <g transform="translate(280 0)">
      <path d="M29 -12L29 12L12 29L-12 29L-29 12L-29 -12L-12 -29L12 -29Z" fill="#080808" stroke="#aaa" stroke-width="1.5"/>
      <circle r="21" fill="none" stroke="#777" stroke-width="1.5"/>
      <path d="M20 -8L29 -12M20 8L29 12M8 20L12 29M-8 20L-12 29M-20 8L-29 12M-20 -8L-29 -12M-8 -20L-12 -29M8 -20L12 -29" stroke="#555"/>
      <circle r="15" fill="#111"/>
      <circle r="10" fill="#e3ad67" opacity=".65"><animate attributeName="opacity" values=".55;.75;.55" dur="1.4s" repeatCount="indefinite"/></circle>
      <path d="M-12 -5H12M-12 0H12M-12 5H12" stroke="#333" stroke-width="2"/>
      <g fill="#080808" stroke="#777"><rect x="-31" y="-6" width="9" height="12" rx="3"/><rect x="22" y="-6" width="9" height="12" rx="3"/></g>
    </g>
    <!-- Chest lid, reinforcing bands and hinges. -->
    <g transform="translate(500 0)">
      <rect x="-25" y="-24" width="50" height="48" rx="4" fill="#080808" stroke="#aaa" stroke-width="1.5"/>
      <path d="M-23 -12H23M-23 0H23M-23 12H23" stroke="#555"/>
      <g fill="#111" stroke="#777"><rect x="-16" y="-23" width="5" height="46" rx="2"/><rect x="11" y="-23" width="5" height="46" rx="2"/></g>
      <g fill="#111" stroke="#aaa"><rect x="-16" y="-26" width="6" height="5" rx="2"/><rect x="10" y="-26" width="6" height="5" rx="2"/></g>
      <rect x="-4" y="19" width="8" height="7" rx="2" fill="#080808" stroke="#e3ad67"/>
    </g>
    <g fill="#aaa" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle"><text x="60" y="53">Drill</text><text x="280" y="53">Furnace</text><text x="500" y="53">Storage</text></g>
  </g>
</svg>
