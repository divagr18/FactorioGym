[project]
name = "factoriorl"
version = "0.1.0"
description = "Embodied Factorio environment for compact RL policies and language-model agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
factoriorl = "factoriorl.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factoriorl"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runtime", ".omo", ".codegraph"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: requires a real Factorio executable"]
