[project]
name = "factoriorl"
version = "0.1.0"
description = "Embodied Factorio environment for compact RL policies and language-model agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
factoriorl = "factoriorl.cli:main"

[project.optional-dependencies]
# A PEP 621 extra, not a dependency group: extras ship in wheel metadata, so
# `pip install factoriorl[rl]` gives an outside researcher a working
# FactorioEnv without cloning this repo (PLAN.md 6.1, 11.2).
rl = ["numpy>=2.1,<3", "gymnasium>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]
# A PEP 735 group, not an extra: a multi-GB CUDA-pinned torch is a local
# development concern and must never enter wheel metadata.
train = [
  "torch>=2.5",
  "stable-baselines3>=2.4",
  "sb3-contrib>=2.4",
  "tensorboard>=2.18",
]

# Torch must come from the CUDA index, not PyPI's CPU-only default wheel.
# `explicit = true` keeps every other package on PyPI.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factoriorl"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runtime", ".omo", ".codegraph"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: requires a real Factorio executable"]
